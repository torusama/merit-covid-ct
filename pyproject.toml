[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "merit-covid-ct"
version = "0.1.0"
description = "Geometry-preserving foundations for binary CT lesion segmentation"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "nibabel>=5", "scipy>=1.10", "PyYAML>=6"]

[project.optional-dependencies]
test = ["pytest>=7"]
training = ["torch>=2"]
unetrpp = ["torch>=2.4.1", "monai==1.5.2", "einops==0.8.2"]
tools = ["Pillow", "opencv-python", "matplotlib", "huggingface_hub", "requests"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"merit_covid.models.unetrpp" = ["LICENSE", "NOTICE", "upstream.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
