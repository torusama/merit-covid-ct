# Fold-0 Colab baseline: 11 index slices, 256x256, native scaled intensity.
# This explicit spatial-mm assumption is not a verified HU intensity policy.
data:
  manifest: ../data/covid19_20/cases.json
  split_path: ../splits/covid19_20_5fold.json
preprocess:
  slab_size: 11
  size_hw: [256, 256]
  intensity_encoding: native
  assume_mm: true
  sampling_mode: index
  boundary_policy: edge
  duplicate_slice_policy: unique
model:
  img_size: [11, 256, 256]
  feature_size: 16
  depths: [3, 3, 3, 3]
  use_tep: true
  use_mer: true
  use_pcg: true
  position_mode: index
  query_chunk_size: 128
loss:
  weighting_mode: index
  sigma_slices: 2.0
  alignment_pool: max
  presence_weight: 0.2
  alignment_weight: 0.05
  salience_weight: 0.03
training:
  device: cuda
  epochs: 100
  batch_size: 1
  num_workers: 0
  learning_rate: 0.0003
  weight_decay: 0.0001
  gradient_clip: 1.0
  warmup_epochs: 30
  amp: true
  threshold: 0.5
  seed: 42
