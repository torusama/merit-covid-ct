# CT ALREADY NORMALIZED; native is PASS THROUGH. NEVER APPLY V3 TWICE.
data:
  manifest: cases.json
  split_path: splits_covid19_20_5fold.json
preprocess:
  slab_size: 11
  size_hw: null
  intensity_encoding: native
  assume_mm: true
  sampling_mode: index
  boundary_policy: edge
  duplicate_slice_policy: unique
  intensity_provenance: PRECOMPUTED_V3_FROM_UNCOMPRESSED_NII; see EXPORT_COMPLETE.json;
    DO_NOT_NORMALIZE_TWICE
model:
  img_size:
  - 11
  - 512
  - 512
  feature_size: 16
  depths:
  - 3
  - 3
  - 3
  - 3
  use_tep: true
  use_mer: true
  use_pcg: true
  position_mode: index
  query_chunk_size: 128
loss:
  weighting_mode: index
  sigma_slices: 2.0
  alignment_pool: max
  presence_weight: 0.2
  alignment_weight: 0.05
  salience_weight: 0.03
training:
  activation_checkpointing: true
  device: cuda
  epochs: 100
  batch_size: 1
  num_workers: 0
  learning_rate: 0.0003
  weight_decay: 0.0001
  gradient_clip: 1.0
  warmup_epochs: 30
  amp: true
  threshold: 0.5
  seed: 42
  shuffle_mode: volume
